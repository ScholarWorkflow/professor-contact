name: issue9-selfpatch

on:
  push:
    branches:
      - fix/issue-9-immutable-stage5-templates

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[issue9-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply issue 9 changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('.')
          state_path = root / '.apm/skills/professor-contact/scripts/contact_state.py'
          agent_path = root / '.apm/agents/professor-contact-email-generator.agent.md'
          validator_path = root / '.apm/agents/professor-contact-email-validator.agent.md'
          skill_path = root / '.apm/skills/professor-contact/SKILL.md'

          # Runner: full-body humanized text becomes an optional legacy validation input only.
          text = state_path.read_text(encoding='utf-8')
          old = '    humanized_by_id = humanized_paths(args, emails, exact=not bool(args.email_id))\n'
          new = '''    humanized_by_id = (\n        humanized_paths(args, emails, exact=not bool(args.email_id))\n        if getattr(args, "humanized_map", None) or getattr(args, "humanized", None)\n        else {}\n    )\n'''
          if old not in text:
              raise SystemExit('stage5 humanized_paths call not found')
          text = text.replace(old, new, 1)

          old_block = '''            humanized = humanized_by_id[output_id].read_text(encoding="utf-8")\n            missing = [p for p in protected if p and p not in humanized]\n            if missing:\n                fail("humanizer_violation",\n                     f"{output_id}: humanized text lost protected strings: {missing}")\n            violated = [b for b in banned if b and b in humanized]\n            if violated:\n                fail("humanizer_violation", f"{output_id}: banned phrases appeared: {violated}")\n            if "{{" in humanized:\n                fail("humanizer_violation", f"{output_id}: residual {{}} placeholders")\n            subject_match = re.match(r"Subject: (.*)", humanized)\n            subject = (choices.get("subject") if kind == "initial" else choices.get("followup_subject"))\n            subject = subject or (subject_match.group(1).strip() if subject_match else\n                                  (subject_line(values) if kind == "initial" else\n                                   f"Re: {choices.get('subject') or subject_line(values)}"))\n            body_text = re.sub(r"^Subject: .*\\n+", "", humanized, count=1)\n'''
          new_block = '''            # Stage 5 owns placeholder substitution, not template wording.  A legacy\n            # --humanized/--humanized-map input may still be supplied by older callers,\n            # but it is validation-only and can never become the rendered email body.\n            if output_id in humanized_by_id:\n                legacy_humanized = humanized_by_id[output_id].read_text(encoding="utf-8")\n                missing = [p for p in protected if p and p not in legacy_humanized]\n                if missing:\n                    fail("humanizer_violation",\n                         f"{output_id}: legacy humanized text lost protected strings: {missing}")\n                violated = [b for b in banned if b and b in legacy_humanized]\n                if violated:\n                    fail("humanizer_violation",\n                         f"{output_id}: banned phrases appeared in legacy humanized text: {violated}")\n                if "{{" in legacy_humanized:\n                    fail("humanizer_violation",\n                         f"{output_id}: residual {{}} placeholders in legacy humanized text")\n\n            rendered = draft\n            violated = [b for b in banned if b and b in rendered]\n            if violated:\n                fail("invalid_result_json",\n                     f"{output_id}: banned phrases appeared after deterministic template assembly: {violated}")\n            if "{{" in rendered:\n                fail("template_error", f"{output_id}: residual {{}} placeholders after assembly")\n            subject_match = re.match(r"Subject: (.*)", rendered)\n            subject = (choices.get("subject") if kind == "initial" else choices.get("followup_subject"))\n            subject = subject or (subject_match.group(1).strip() if subject_match else\n                                  (subject_line(values) if kind == "initial" else\n                                   f"Re: {choices.get('subject') or subject_line(values)}"))\n            body_text = re.sub(r"^Subject: .*\\n+", "", rendered, count=1)\n'''
          if old_block not in text:
              raise SystemExit('stage5 humanized render block not found')
          text = text.replace(old_block, new_block, 1)
          text = text.replace(' ｜ 过稿: humanizer-ja(business)',
                              ' ｜ 模板固定文本: immutable ｜ 动态字段: validated', 1)
          state_path.write_text(text, encoding='utf-8')

          # Email generator: retain all other Stage 5 rules, but make template ownership explicit
          # and constrain optional humanization to dynamic JSON fields before assembly.
          text = agent_path.read_text(encoding='utf-8')
          text = text.replace(
              'Before writing, runs a `humanizer-ja` pass (business モード) over each assembled email body (AI-文体 polish + template-composition redundancy merge). For multiple emails, `--humanized-map` maps each email_id to a distinct absolute humanized file; all emails are prevalidated before any md/txt/state/overview write, so one failure leaves the batch untouched.',
              'The user-supplied initial/follow-up templates are immutable inputs. Optional `humanizer-ja` (business モード) may polish only model-generated dynamic fields before deterministic template assembly; it never receives an assembled email body. All emails are prevalidated before any md/txt/state/overview write, so one failure leaves the batch untouched.')
          text = text.replace(
              '你的循环：**`stage5-plan --mode both`（模型 job + 核验缓存检查）→ 需要时跑 Step 2.5 送信前核验 → 写模型 result JSON（首封的 4 句兴趣段 + source_map + 未来志向 + 学習中候选）→ 交互取用户选择（含初次发送日期）→ `stage5-plan --mode both --result --choices`（得首封和跟进草稿与保护串）→ humanizer-ja 分别过稿 → `stage5-finalize --mode both --humanized-map`（校验+写盘）→ validator 循环**。',
              '你的循环：**`stage5-plan --mode both`（模型 job + 核验缓存检查）→ 需要时跑 Step 2.5 送信前核验 → 写模型 result JSON（首封的 4 句兴趣段 + source_map + 未来志向 + 学習中候选）→ 可选仅对这些动态字段逐字段使用 humanizer-ja → 交互取用户选择（含初次发送日期）→ `stage5-plan --mode both --result --choices`（确定性预览首封和跟进）→ `stage5-finalize --mode both`（直接用稳定模板确定性拼装+校验+写盘）→ validator 循环**。')
          text = text.replace('、humanizer 保护串校验——全部由 runner', '、模板不可变校验——全部由 runner')
          text = text.replace('3. `write` — 模型 result JSON、choices JSON、humanized 正文文本文件（均在 `/tmp`）。',
                              '3. `write` — 模型 result JSON、choices JSON，以及可选的逐字段 polish 中间 JSON（均在 `/tmp`）。')
          text = text.replace('6. `skill` — `humanizer-ja`（business モード）。',
                              '6. `skill` — `humanizer-ja`（business モード，可选；只能接收模型生成的动态字段，禁止接收模板或整封邮件）。')

          pattern = re.compile(r'### Step 5 — humanizer-ja 过稿（business モード）\n.*?### Step 6 — stage5-finalize（校验 \+ 写盘）\n', re.S)
          replacement = '''### Step 5 — 可选动态字段 polish（business モード）\n`humanizer-ja` **不是整封邮件过稿器**。只有调用方明确配置了动态字段 polish 时才调用，而且每次只给它模型生成字段本身：`interest_sentences_ja[]`、`future_aspiration_ja`，以及尚未由用户选定前的 `learning_candidates[]`。\n\n硬边界：\n- **禁止**把模板、已拼装 draft、Subject、抬头、署名、学校/研究科/入学信息或跟进模板交给 humanizer。\n- polish 后仍写回同一 result JSON 字段；`schema/kind/email_id/source_map` 不变，4 句数量与④固定句契约不变。\n- 用户已经选定的 `learning`、署名、志望、日期等 choice 字段不做 humanize。\n- 如果没有配置动态字段 polish，直接使用原模型 result。\n\n模板所有权：用户负责在工作流外准备并一次性编辑/人性化 `套磁模板.md` 与 `套磁跟进模板.md`；Stage 5 只消费最终稳定版本，绝不改写其固定措辞。\n\n### Step 6 — stage5-finalize（校验 + 写盘）\n'''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit('agent Step 5 section not found')
          text = text.replace('   --program-root <abs> --mode both --result <raw result> --humanized-map <map.json> --choices <choices.json> [--email-id ...]',
                              '   --program-root <abs> --mode both --result <final dynamic result> --choices <choices.json> [--email-id ...]')
          # Replace old full-body map/check paragraphs in Step 6.
          text = re.sub(
              r'- `--humanized-map` 格式为 .*?\n- runner 校验：result 契约重查；\*\*保护串完整性\*\*.*?先补 Step 2\.5）。\n',
              '- runner 重新校验动态 result 契约、红线、占位符与核验缓存，然后**从用户模板原文重新确定性拼装**首封/跟进；没有任何模板级改写阶段。旧版 `--humanized` / `--humanized-map` 若被外部调用方传入，仅作兼容性保护串检查，永远不会成为最终正文。\n',
              text, count=1, flags=re.S)
          text = text.replace('validator 校验的是过稿后的最终文本。', 'validator 校验的是确定性模板拼装后的最终文本。')
          text = text.replace('**humanizer 保护**：protected 串（Subject/标题/用户选定短语/模板填充值/未来志向）丢一即 `humanizer_violation` 拒绝——重做过稿而不是手补。',
                              '**模板不可变**：固定模板字符只允许显式 `{{...}}` 占位符被替换；Stage 5 不对模板其余字节做任何改写。')
          if '--humanized-map' in text:
              # Only the compatibility note above may mention it.
              occurrences = [m.start() for m in re.finditer('--humanized-map', text)]
              if len(occurrences) > 1:
                  raise SystemExit('unexpected full-body --humanized-map instructions remain')
          agent_path.write_text(text, encoding='utf-8')

          # Main skill: Stage 5 summary and explicit template ownership.
          text = skill_path.read_text(encoding='utf-8')
          text = text.replace('送信前核对表/来源表/事实核对卡/humanizer 保护串',
                              '送信前核对表/来源表/事实核对卡/模板不可变校验')
          lines = text.splitlines()
          for i, line in enumerate(lines):
              if line.startswith('| 5 | `professor-contact-email-generator` |'):
                  lines[i] = ('| 5 | `professor-contact-email-generator` | **只读邮件输入包**（+profile/模板/info/boshu/`_contact_verify.json`）：默认生成首封和无回复跟进；模型只生成动态字段；用户准备的首封/跟进模板作为 immutable input 原样消费；可选 humanizer-ja 只能逐字段 polish 动态模型文本，禁止整封过稿；runner 最后从模板原文确定性替换显式占位符并写盘，再跑 validator | 每封选中邮件独立的 `套磁邮件.md`/`.txt` 与 `套磁跟进邮件.md`/`.txt`（单封用固定名，多封按方向与想法 ID 加后缀）+ `<教授名>/套磁邮件状态.json` + `套磁邮件总览.md` + `_contact_verify.json` |')
                  break
          else:
              raise SystemExit('Stage 5 overview row not found')
          text = '\n'.join(lines) + ('\n' if text.endswith('\n') else '')
          ownership = '''\n## Stage 5 模板所有权（immutable input）\n\n- `套磁模板.md` 与 `套磁跟进模板.md` 由用户准备；任何一次性的模板 humanize / 编辑都发生在 professor-contact 工作流之外。\n- Stage 5 把这两个文件视为稳定输入：固定文本按原字节保留，只对显式 `{{...}}` 占位符做确定性替换。\n- 模型只生成教授相关动态字段。若配置 `humanizer-ja`，只能在模板拼装**之前**逐字段处理这些动态字段；不得把 Subject、模板或整封 draft 交给 humanizer。\n- 首封与无回复跟进继续分别生成、写盘并由最终 validator 校验。\n'''
          if '## Stage 5 模板所有权（immutable input）' not in text:
              text = text.rstrip() + '\n' + ownership
          skill_path.write_text(text, encoding='utf-8')

          # Validator: fixed template text is now strict, with no full-body-humanizer exception.
          text = validator_path.read_text(encoding='utf-8')
          text = text.replace('template fixed text unaltered except humanizer wording polish (fact changes = blocking)',
                              'template fixed text unaltered outside explicit placeholders (any internal rewrite = blocking)')
          text = text.replace(
              '5. **模板固定文本原样（blocking/minor）**：非模型创作段落（寒暄/自我介绍/资历/请求/收尾）基本对应模板骨架；被擅自改写 → minor，改变事实（如工作经历年限、TOEIC 分数）→ blocking。**例外**：humanizer-ja 过稿的纯措辞润色/拼装冗余合并不算——只盯事实是否被改。',
              '5. **模板固定文本原样（blocking）**：非模型创作段落（寒暄/自我介绍/资历/请求/收尾）必须保持用户最终模板原文；除显式 `{{...}}` 占位符替换外，Stage 5 不得改写、合并或润色模板固定措辞。发现内部改写 → blocking。')
          validator_path.write_text(text, encoding='utf-8')

          # Focused regression tests for issue #9.
          test_path = root / '.apm/skills/professor-contact/tests/test_stage5_immutable_templates.py'
          test_path.write_text(r'''import importlib.util
import json
import sys
from pathlib import Path

HERE = Path(__file__).resolve().parent
spec = importlib.util.spec_from_file_location("contact_state_test_helpers", HERE / "test_contact_state.py")
helpers = importlib.util.module_from_spec(spec)
sys.modules[spec.name] = helpers
spec.loader.exec_module(helpers)

BaseEnv = helpers.BaseEnv
TestStage5 = helpers.TestStage5
parse = helpers.parse
run_cli = helpers.run_cli


class TestStage5ImmutableTemplates(BaseEnv):
    prepare = TestStage5.prepare
    raw_result = TestStage5.raw_result
    choices = TestStage5.choices

    def write_inputs(self, g1, *, choices=None):
        raw_path = self.root / "issue9-raw.json"
        raw_path.write_text(json.dumps(self.raw_result(g1), ensure_ascii=False), encoding="utf-8")
        choices_path = self.root / "issue9-choices.json"
        choices_path.write_text(json.dumps(choices or self.choices(), ensure_ascii=False), encoding="utf-8")
        return raw_path, choices_path

    def template(self):
        path = self.root / "immutable-template.md"
        path.write_text(
            "IMMUTABLE-BEGIN\n"
            "{{大学}}／{{研究科}}／{{先生名}}先生\n"
            "IMMUTABLE-SELFINTRO {{出身校}} {{氏名}}\n"
            "{{入学年度}} {{入学月}} {{専攻}} {{学位}}\n"
            "IMMUTABLE-INTEREST-HEAD\n{{兴趣段}}\n"
            "IMMUTABLE-FUTURE-HEAD\n{{未来志向}}\n"
            "IMMUTABLE-LEARNING {{学習中}}\n"
            "{{志望}}\n"
            "IMMUTABLE-END",
            encoding="utf-8")
        return path

    def followup_template(self):
        path = self.root / "immutable-followup-template.md"
        path.write_text(
            "FOLLOWUP-IMMUTABLE-BEGIN\n"
            "{{先生名}}先生\n{{大学}} {{研究科}} {{学位}}\n"
            "{{出身校}} {{氏名}}\n{{初回送信日}}\n{{研究主题}}\n{{メールアドレス}}\n"
            "FOLLOWUP-IMMUTABLE-END",
            encoding="utf-8")
        return path

    def test_finalize_needs_no_full_body_humanizer_and_preserves_template_text(self):
        g1 = self.prepare()
        raw_path, choices_path = self.write_inputs(g1)
        out = parse(run_cli(
            "stage5-finalize", "--program-root", self.root,
            "--result", raw_path, "--choices", choices_path,
            "--template", self.template()))
        self.assertEqual(out["status"], "ok", out)
        txt = (self.prof_dir / "套磁邮件.txt").read_text(encoding="utf-8")
        for fixed in ("IMMUTABLE-BEGIN", "IMMUTABLE-SELFINTRO",
                      "IMMUTABLE-INTEREST-HEAD", "IMMUTABLE-FUTURE-HEAD",
                      "IMMUTABLE-LEARNING", "IMMUTABLE-END"):
            self.assertIn(fixed, txt)
        self.assertNotIn("{{", txt)

    def test_legacy_humanized_body_can_never_mutate_fixed_template_segments(self):
        g1 = self.prepare()
        raw_path, choices_path = self.write_inputs(g1)
        template = self.template()
        plan = parse(run_cli(
            "stage5-plan", "--program-root", self.root,
            "--result", raw_path, "--choices", choices_path,
            "--template", template))
        self.assertEqual(plan["status"], "ok", plan)
        legacy = self.root / "legacy-humanized.txt"
        legacy.write_text(
            plan["drafts"][0]["draft"].replace("IMMUTABLE-BEGIN", "MUTATED-BY-FULL-BODY-HUMANIZER"),
            encoding="utf-8")
        out = parse(run_cli(
            "stage5-finalize", "--program-root", self.root,
            "--result", raw_path, "--choices", choices_path,
            "--template", template, "--humanized", legacy))
        self.assertEqual(out["status"], "ok", out)
        txt = (self.prof_dir / "套磁邮件.txt").read_text(encoding="utf-8")
        self.assertIn("IMMUTABLE-BEGIN", txt)
        self.assertNotIn("MUTATED-BY-FULL-BODY-HUMANIZER", txt)

    def test_first_and_followup_render_without_full_body_humanizer(self):
        g1 = self.prepare()
        choices = dict(self.choices(), initial_sent_date="2026年9月1日")
        raw_path, choices_path = self.write_inputs(g1, choices=choices)
        out = parse(run_cli(
            "stage5-finalize", "--program-root", self.root, "--mode", "both",
            "--result", raw_path, "--choices", choices_path,
            "--template", self.template(),
            "--followup-template", self.followup_template()))
        self.assertEqual(out["status"], "ok", out)
        self.assertEqual({row["kind"] for row in out["emails"]}, {"initial", "followup"})
        followup = (self.prof_dir / "套磁跟进邮件.txt").read_text(encoding="utf-8")
        self.assertIn("FOLLOWUP-IMMUTABLE-BEGIN", followup)
        self.assertIn("FOLLOWUP-IMMUTABLE-END", followup)
        self.assertIn("2026年9月1日", followup)
''', encoding='utf-8')

          # Sanity guards against accidentally leaving the workflow instructions on full-body humanization.
          agent = agent_path.read_text(encoding='utf-8')
          if 'humanizer-ja 分别过稿' in agent:
              raise SystemExit('full-body humanizer flow remains in email generator')
          if 'Step 5 — humanizer-ja 过稿' in agent:
              raise SystemExit('old full-body Step 5 remains')
          validator = validator_path.read_text(encoding='utf-8')
          if 'humanizer-ja 过稿的纯措辞润色' in validator:
              raise SystemExit('validator still exempts template-wide humanization')
          PY
      - name: Run tests
        run: python -m unittest discover -s .apm/skills/professor-contact/tests -v
      - name: Commit implementation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .apm
          git commit -m 'fix: keep Stage 5 templates immutable [issue9-patched]'
          git push
