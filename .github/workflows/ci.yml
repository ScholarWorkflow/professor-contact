name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The issue 74 observers read the 768b49e compatibility baseline
          # through git, so CI needs history beyond the default depth 1.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run professor-contact regression suite
        run: python -m unittest discover -s .apm/skills/professor-contact/tests -p 'test_*.py' -v
