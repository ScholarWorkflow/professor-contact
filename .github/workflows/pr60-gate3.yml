name: PR60 Gate 3 clean consumer

on:
  push:
    branches: [codex/issue-59-stage5-email-scope]

permissions:
  contents: read

jobs:
  gate3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install frozen Recipe tooling
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install 'apm-cli==0.29.0'
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_amd64 -o "$RUNNER_TEMP/yq"
          chmod +x "$RUNNER_TEMP/yq"
          sudo install "$RUNNER_TEMP/yq" /usr/local/bin/yq
          python3 --version
          apm --version
          yq --version
      - name: Run frozen Issue 59 Gate 3 Recipe
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRODUCER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          : "${PRODUCER_SHA:?set exact candidate SHA}"

          RUN_ROOT="$(mktemp -d /tmp/issue59-stage5-email-scope.XXXXXX)"
          CONFIG_DIR="$RUN_ROOT/config"
          OUTPUT_DIR="$RUN_ROOT/output"
          CONSUMER_ROOT="$RUN_ROOT/consumer"
          mkdir -p "$CONFIG_DIR" "$OUTPUT_DIR" "$CONSUMER_ROOT"
          printf '%s\n' "$RUN_ROOT" > "$OUTPUT_DIR/run-root.txt"
          printf '%s\n' "$PRODUCER_SHA" > "$OUTPUT_DIR/producer-sha.txt"
          printf '%s\n' "$CONSUMER_ROOT" > "$OUTPUT_DIR/consumer-path.txt"
          printf '%s\n' 'apm install "https://github.com/ScholarWorkflow/professor-contact.git#$PRODUCER_SHA" --target opencode --trust-transitive-mcp' > "$OUTPUT_DIR/install-command.txt"

          # Authentication setup only; the recorded APM source remains the frozen remote URL.
          git config --global url."https://x-access-token:${GITHUB_TOKEN}@github.com/".insteadOf "https://github.com/"

          cd "$CONSUMER_ROOT"
          git init -q
          apm install "https://github.com/ScholarWorkflow/professor-contact.git#$PRODUCER_SHA" \
            --target opencode \
            --trust-transitive-mcp \
            2>&1 | tee "$OUTPUT_DIR/apm-install.log"

          cp apm.lock.yaml "$OUTPUT_DIR/apm.lock.yaml"
          sha256sum apm.lock.yaml > "$OUTPUT_DIR/apm-lock-sha256.txt"
          export PRODUCER_SHA
          yq -e '[.dependencies[] | select(.name == "professor-contact" and .resolved_commit == strenv(PRODUCER_SHA))] | length == 1' apm.lock.yaml \
            > "$OUTPUT_DIR/lock-resolution.txt"
          python3 --version > "$OUTPUT_DIR/python-version.txt" 2>&1
          apm --version > "$OUTPUT_DIR/apm-version.txt" 2>&1

          SKILL_ROOT="$CONSUMER_ROOT/.agents/skills/professor-contact"
          test -d "$SKILL_ROOT/tests"

          cat > "$OUTPUT_DIR/fixture-provenance.txt" <<'EOF'
          fixture_repo_sha: N/A
          fixture_repo_dirty: no
          fixture_run_id: N/A
          fixture_kind: none
          fixture_manifest_evidence: N/A
          manual_patch: no
          EOF

          snapshot_issue59_consumer() {
            python3 - "$CONSUMER_ROOT" "$1" <<'PY'
          import hashlib
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1]).resolve()
          out = Path(sys.argv[2])
          rows = []
          for base, dirs, files in os.walk(root, topdown=True, followlinks=False):
              base_path = Path(base)
              dirs[:] = sorted(d for d in dirs if d not in {'.git', '__pycache__'})
              for name in sorted(files):
                  if name.endswith('.pyc'):
                      continue
                  path = base_path / name
                  rel = path.relative_to(root).as_posix()
                  if path.is_symlink():
                      rows.append(f'L\t{rel}\t{os.readlink(path)}')
                  else:
                      h = hashlib.sha256()
                      with path.open('rb') as fh:
                          for chunk in iter(lambda: fh.read(1024 * 1024), b''):
                              h.update(chunk)
                      rows.append(f'F\t{rel}\t{h.hexdigest()}')
          out.write_text('\n'.join(rows) + '\n', encoding='utf-8')
          PY
          }

          check_one_unittest_execution() {
            python3 - "$1" <<'PY'
          import re
          import sys
          from pathlib import Path

          text = Path(sys.argv[1]).read_text(encoding='utf-8', errors='replace')
          runs = re.findall(r'^Ran ([0-9]+) tests? in ', text, flags=re.MULTILINE)
          if runs != ['1']:
              raise SystemExit(f'expected exactly one executed unittest method, saw Ran={runs!r}')
          if re.search(r'^OK \([^\n]*(?:skipped|expected failures)=[1-9][0-9]*', text, flags=re.MULTILINE):
              raise SystemExit('focused unittest was skipped or marked expected-failure')
          PY
          }

          snapshot_issue59_consumer "$OUTPUT_DIR/consumer-tree-before.sha256"

          ISSUE59_CASES="1 2 3 4 5 6 7"
          REUSED_PATTERNS="stage5_choices_id_mapping_fails_closed stage5_batch_failure_does_not_write_first_email stage5_multiple_emails_use_distinct_files"
          HANDOFF_PATTERNS="test_06_email_pack_exact_join_only test_10_email_pack_self_contained"
          printf '%s\n' "$ISSUE59_CASES" > "$OUTPUT_DIR/issue59-case-set.txt"
          printf '%s\n' "$REUSED_PATTERNS" > "$OUTPUT_DIR/reused-pattern-set.txt"
          printf '%s\n' "$HANDOFF_PATTERNS" > "$OUTPUT_DIR/handoff-pattern-set.txt"

          set -o pipefail
          ISSUE59_RC=0
          for N in $ISSUE59_CASES; do
            PATTERN="issue59_t59_$N"
            set +e
            python3 -m unittest discover \
              -s "$SKILL_ROOT/tests" \
              -p 'test_*.py' \
              -k "$PATTERN" -v \
              2>&1 | tee "$OUTPUT_DIR/$PATTERN.log"
            RC=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$RC" > "$OUTPUT_DIR/$PATTERN.status.txt"
            set +e
            check_one_unittest_execution "$OUTPUT_DIR/$PATTERN.log"
            EXEC_RC=$?
            set -e
            printf '%s\n' "$EXEC_RC" > "$OUTPUT_DIR/$PATTERN.execution-proof.status.txt"
            if [ "$RC" -ne 0 ] || [ "$EXEC_RC" -ne 0 ]; then ISSUE59_RC=1; fi
          done
          printf '%s\n' "$ISSUE59_RC" > "$OUTPUT_DIR/issue59-status.txt"

          REUSED_RC=0
          for PATTERN in $REUSED_PATTERNS; do
            set +e
            python3 -m unittest discover \
              -s "$SKILL_ROOT/tests" \
              -p 'test_*.py' \
              -k "$PATTERN" -v \
              2>&1 | tee "$OUTPUT_DIR/$PATTERN.log"
            RC=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$RC" > "$OUTPUT_DIR/$PATTERN.status.txt"
            set +e
            check_one_unittest_execution "$OUTPUT_DIR/$PATTERN.log"
            EXEC_RC=$?
            set -e
            printf '%s\n' "$EXEC_RC" > "$OUTPUT_DIR/$PATTERN.execution-proof.status.txt"
            if [ "$RC" -ne 0 ] || [ "$EXEC_RC" -ne 0 ]; then REUSED_RC=1; fi
          done
          printf '%s\n' "$REUSED_RC" > "$OUTPUT_DIR/reused-status.txt"

          HANDOFF_RC=0
          for PATTERN in $HANDOFF_PATTERNS; do
            case "$PATTERN" in
              test_06_email_pack_exact_join_only|test_10_email_pack_self_contained) ;;
              *) echo "unfrozen handoff pattern: $PATTERN" >&2; exit 2 ;;
            esac
            set +e
            python3 -m unittest discover \
              -s "$SKILL_ROOT/tests" \
              -p 'test_*.py' \
              -k "$PATTERN" -v \
              2>&1 | tee "$OUTPUT_DIR/$PATTERN.log"
            RC=${PIPESTATUS[0]}
            set -e
            printf '%s\n' "$RC" > "$OUTPUT_DIR/$PATTERN.status.txt"
            set +e
            check_one_unittest_execution "$OUTPUT_DIR/$PATTERN.log"
            EXEC_RC=$?
            set -e
            printf '%s\n' "$EXEC_RC" > "$OUTPUT_DIR/$PATTERN.execution-proof.status.txt"
            if [ "$RC" -ne 0 ] || [ "$EXEC_RC" -ne 0 ]; then HANDOFF_RC=1; fi
          done
          printf '%s\n' "$HANDOFF_RC" > "$OUTPUT_DIR/handoff-status.txt"

          snapshot_issue59_consumer "$OUTPUT_DIR/consumer-tree-after.sha256"
          set +e
          cmp -s "$OUTPUT_DIR/consumer-tree-before.sha256" "$OUTPUT_DIR/consumer-tree-after.sha256"
          TREE_RC=$?
          set -e
          printf '%s\n' "$TREE_RC" > "$OUTPUT_DIR/consumer-tree-compare.status.txt"

          python3 - "$OUTPUT_DIR" "$PRODUCER_SHA" <<'PY'
          import csv
          import sys
          from pathlib import Path

          out = Path(sys.argv[1])
          sha = sys.argv[2]

          def classify(stem):
              rc = int((out / f'{stem}.status.txt').read_text().strip())
              proof = int((out / f'{stem}.execution-proof.status.txt').read_text().strip())
              if proof != 0:
                  return 'NOT TESTED'
              if rc != 0:
                  return 'FAIL'
              return 'PASS — executed_on_current_sha'

          with (out / 'case-verdicts.tsv').open('w', encoding='utf-8', newline='') as fh:
              w = csv.writer(fh, delimiter='\t', lineterminator='\n')
              w.writerow(['case_id','verdict','source_sha','reused_pass','revalidation_reason','impact_analysis','evidence_files'])
              for n in range(1, 8):
                  stem = f'issue59_t59_{n}'
                  w.writerow([f'T59-{n}', classify(stem), sha, 'no', 'executed', 'N/A', f'{stem}.log;{stem}.status.txt;{stem}.execution-proof.status.txt'])

          supporting = [
              ('R59-choices-mapping', 'stage5_choices_id_mapping_fails_closed'),
              ('R59-batch-precommit', 'stage5_batch_failure_does_not_write_first_email'),
              ('R59-multi-email-shared-state', 'stage5_multiple_emails_use_distinct_files'),
              ('H06-stage4-exact-join', 'test_06_email_pack_exact_join_only'),
              ('H10-stage4-self-contained', 'test_10_email_pack_self_contained'),
          ]
          with (out / 'supporting-verdicts.tsv').open('w', encoding='utf-8', newline='') as fh:
              w = csv.writer(fh, delimiter='\t', lineterminator='\n')
              w.writerow(['proof_id','verdict','source_sha','reused_pass','revalidation_reason','impact_analysis','evidence_files'])
              for proof_id, stem in supporting:
                  w.writerow([proof_id, classify(stem), sha, 'no', 'executed', 'N/A', f'{stem}.log;{stem}.status.txt;{stem}.execution-proof.status.txt'])
          PY

          python3 - "$OUTPUT_DIR/case-verdicts.tsv" "$OUTPUT_DIR/supporting-verdicts.tsv" "$PRODUCER_SHA" <<'PY'
          import csv
          import sys
          from pathlib import Path

          allowed = {'PASS — executed_on_current_sha', 'PASS — reused_from_prior_sha', 'FAIL', 'BLOCKED', 'NOT TESTED'}
          case_path, supporting_path, sha = map(Path, sys.argv[1:3]) + (None,)
          PY
