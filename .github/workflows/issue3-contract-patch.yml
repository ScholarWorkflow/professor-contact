name: Issue 3 contract patch

on:
  push:
    branches: [issue-3-chatgpt-stage2-handoff]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-3-chatgpt-stage2-handoff
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch caller and analyzer contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {label}")
              return text.replace(old, new, 1)

          skill_path = Path('.apm/skills/professor-contact/SKILL.md')
          skill = skill_path.read_text(encoding='utf-8')
          old_row = '| 2 | `professor-contact-analyzer` | 判定相关论文、署名、主线，跑 `paper-analysis`（sidecar-first 链不变：有效 sidecar → 迁移相关论文 legacy → 只对未解决目标 `gap-only`）。随后**组装 facts 交给 runner**：`stage2-plan` 生成 freshness/narrative 模型 job（gap 池只来自有效 sidecar，`gap_scope` 选择范围；shortlist 稳定排序 5–10 条），模型 job 结果经 `stage2-finalize` 校验后原子写**输入包**并确定性渲染报告；`done_by_self` 进黑名单；白话校验结果另由 `stage2-record-validation` 写入独立字段 | `<教授名>/套磁候选输入.json`（阶段 3 唯一事实源）+ `<教授名>/套磁候选分析.md`（runner 渲染，含折叠 freshness 卡）+ `<教授名>/论文分析/_freshness_cache.json` + `_index.json`/sidecar/`_ocr`（同 v1）+（可选）KB 条目 |'
          new_row = '| 2 | `professor-contact-analyzer` | 判定相关论文、署名、主线与实际 post-cost-gate 分析 scope 后，**总是先生成确定性的 ChatGPT handoff ZIP**。`chatgpt_handoff=continue` 时 ZIP 只是低成本 side effect，随后旧的本地 OCR/`paper-analysis` 路径语义不变；`wait` 时在任何新 OCR/`paper-analysis` 前软停止。提供匹配 result ZIP 后先严格本地导入成普通 analysis/sidecar，再继续既有 `stage2-plan → stage2-finalize`。gap/runner/状态机仍完全本地 | `<教授名>/论文分析/_chatgpt_handoff/stage2-<id>.zip`（传输层）+ 原有 `<教授名>/套磁候选输入.json`（阶段 3 唯一事实源）/分析报告/_freshness_cache/index/sidecar |'
          skill = must_replace(skill, old_row, new_row, 'skill stage2 row')

          handoff_section = r'''
## Stage 2 ChatGPT handoff（只替换逐论文高耗分析）

Stage 2 的 handoff 是**可选执行通道，不是第二套工作流**。`套磁候选输入.json` 仍是 Stage 3 唯一事实源，`contact_state.py stage2-plan/stage2-finalize`、gap/item/fingerprint 校验、Stage 3–5 全部保持本地权威。

### 启动时只问一次

- 完整 workflow **交互式**启动且调用方没有显式给 `chatgpt_handoff` 时，caller 必须在进入 Stage 2 前只问一次：
  1. `继续本地执行（仍生成 ChatGPT ZIP）` → `chatgpt_handoff=continue`
  2. `生成 ZIP 后暂停，等待 ChatGPT 结果` → `chatgpt_handoff=wait`
- 一旦选定，把该值原样传给 `professor-contact-analyzer`；**handoff 点不得再次提问**。
- 非交互/旧自动化没有该字段时固定按 `continue`，绝不因为升级后突然等待。
- 两种模式生成完全相同的逻辑 bundle；`continue` 不改变普通 Stage 2 结果语义，`wait` 不允许偷偷本地 OCR/`paper-analysis` 补齐。

### wait / resume

`wait` 在 analyzer 已完成方向可信度、署名、相关论文选择、成本门、幂等过滤与确定性 carrier/future-work prepare 后生成：

`<教授目录>/论文分析/_chatgpt_handoff/stage2-<handoff_id>.zip`

若确有待分析 jobs，analyzer 返回 `result=needs_external_result`、`reason_code=chatgpt_result_required`、`handoff_id`、`bundle_path`，这是软停止而非错误。零 jobs 时无需等待，继续普通 Stage 2。

用户把该 ZIP 交给 ChatGPT/外部处理并拿回 `stage2-<handoff_id>-result.zip` 后，重新调用同一教授的 Stage 2，并传 `chatgpt_handoff: wait` + `chatgpt_result: <result.zip绝对路径>`。analyzer **先按当前本地输入重新确定性构建 current bundle，再用 current bundle 校验 result**：因此 PDF/abstract/note/scope/local baseline 任一变化都会改变 handoff/source fingerprint，使旧 result 自动拒绝。匹配结果只会被安装到普通 `论文分析/...md`、本地 finalize 的 `.future_work.json` 与 `_index.json`；随后继续 sidecar/facts/`stage2-plan`/`stage2-finalize`，下游不知道执行者来自 handoff。

外部 ZIP 永远不能直接提供权威 `_index.json`、`.future_work.json`、`套磁候选输入.json`、gap_id 或其它 Stage 3 状态。多教授等待时每教授各有 bundle；恢复时用 `professors=<单个教授>` 逐个提交对应 result，避免错配。

'''
          skill = must_replace(skill, '\n## 标记语义\n', '\n' + handoff_section + '## 标记语义\n', 'skill handoff section')

          old_call = '''# 阶段 2：分析（不读 profile；契合判断在阶段 3）
task(subagent_type: "professor-contact-analyzer", prompt: "folder_path: <...>\\npaper_analysis: relevant|all（可选，缺省 relevant）\\ngap_scope: relevant|selected_direction|all（可选，缺省 selected_direction）\\nfreshness_scope: shortlist|full（可选，缺省 shortlist）\\nkb_import: true|false（可选，缺省 false）")'''
          new_call = '''# 阶段 2：分析（交互式 caller 已在这里之前把 handoff 模式问好；非交互缺省 continue）
task(subagent_type: "professor-contact-analyzer", prompt: "folder_path: <...>\\nchatgpt_handoff: continue|wait（非交互缺省 continue）\\nchatgpt_result: <匹配 result ZIP 绝对路径，可选，仅 resume>\\npaper_analysis: relevant|all（可选，缺省 relevant）\\ngap_scope: relevant|selected_direction|all（可选，缺省 selected_direction）\\nfreshness_scope: shortlist|full（可选，缺省 shortlist）\\nkb_import: true|false（可选，缺省 false）")'''
          skill = must_replace(skill, old_call, new_call, 'skill stage2 call')

          freshness_row = '| `freshness_scope` | no | 仅阶段 2：`shortlist`（稳定排序 5–10 条，缺省）/ `full`（候选池全部）。 |'
          extra_rows = freshness_row + '''
| `chatgpt_handoff` | no | 仅阶段 2：`continue` / `wait`。交互式完整 workflow 由 caller 在 Stage 2 前问一次；非交互省略固定等价 `continue`。两者都生成同一 bundle。 |
| `chatgpt_result` | no | 仅阶段 2 resume：外部 result ZIP 的绝对路径。必须与本轮按当前输入重新生成的 current bundle 的 handoff/source/job/hash 完全匹配；`wait` 下不完整结果绝不本地补算。 |'''
          skill = must_replace(skill, freshness_row, extra_rows, 'skill input rows')

          ocr_bullet = '- `<教授名>/论文分析/_ocr/<标题>.txt` — 阶段 2：扫描版 PDF 的 LLM OCR 产物（含元数据头 + 逐页文本 + 图描述；复用 vision-tools glance 链；不入库、无 `llm_ocr` 标记；重跑复用）。'
          handoff_bullet = ocr_bullet + '\n- `<教授名>/论文分析/_chatgpt_handoff/stage2-<handoff_id>/` + `.zip` — 阶段 2 的 portable 执行 handoff；只含 post-cost-gate/post-idempotency 待分析 jobs、最小方向上下文与确定性 future-work 候选。`_latest.json` 只做 stale guard；这些文件是瞬时执行输入，**不是任何后续阶段事实源**。'
          skill = must_replace(skill, ocr_bullet, handoff_bullet, 'skill output bullet')

          behavior_marker = '## Behavior notes for callers\n\n'
          behavior_insert = behavior_marker + '- **handoff barrier 是 Stage 2 的固定副作用**：每次有待分析 job 都先生成 ZIP；`continue` 随后按旧路径本地执行，`wait` 在任何新 OCR/逐论文模型调用前返回 `needs_external_result`。resume 先重建 current bundle 再验 result，防止旧 PDF/note/scope 结果被误装。\n'
          skill = must_replace(skill, behavior_marker, behavior_insert, 'skill behavior')
          skill_path.write_text(skill, encoding='utf-8')

          agent_path = Path('.apm/agents/professor-contact-analyzer.agent.md')
          agent = agent_path.read_text(encoding='utf-8')

          max_line = '- `max_relevant_papers` (optional) — 对每个被标记方向最多处理多少篇非点名相关论文。仅用于显式小批、benchmark 或用户主动限额；缺省保留原成本门行为。用户在 note 中点名的论文永不因该值被截断。'
          input_extra = max_line + '''
- `chatgpt_handoff` (optional) — `continue|wait`。完整交互式 workflow 的 caller 必须在进入本 agent 前问一次并显式传入；本 agent **绝不在 handoff 点二次询问**。字段缺失按非交互/向后兼容语义固定为 `continue`。
- `chatgpt_result` (optional) — resume 时外部 result ZIP 绝对路径。不要接受外部 `_index.json`/`.future_work.json`/`套磁候选输入.json`。本轮会先按**当前** scope/carrier/source 重新 build current bundle，再把此 result 对 current bundle 做严格 import；旧输入自动 stale。'''
          agent = must_replace(agent, max_line, input_extra, 'agent inputs')

          old_bash = '3. bash — `skillrepo exec professor-contact .apm/skills/professor-contact/scripts/contact_state.py <子命令>`（runner：stage2-plan / stage2-finalize，stdout 稳定 JSON）；`skillrepo exec professor-contact .apm/skills/professor-contact/scripts/stage2_input_router.py --papers ... --output-dir ...`（Stage 2 输入路由；stdout 只消费 compact status/path，绝不读取/回显 normalized JSON 正文）；curl for Zotero probes; `uv run --with pymupdf python3 -c ...` for PDF first-page extraction / 乱码度判断 / 页面渲染; `python3` for JSON parse/write（`ensure_ascii=False, indent=1`）; `date`。'
          new_bash = '3. bash — `skillrepo exec professor-contact .apm/skills/professor-contact/scripts/contact_state.py <子命令>`（runner）；`skillrepo exec professor-contact .apm/skills/professor-contact/scripts/stage2_input_router.py ...`（normalized abstract fallback）；`skillrepo exec professor-contact .apm/skills/professor-contact/scripts/stage2_chatgpt_handoff.py build|import ...`（纯确定性 ZIP transport；stdout 只消费 compact JSON）；existing `paper-analysis` installation 中的绝对 `future_work.py` 仅运行 `prepare/merge-ocr/validate/finalize` 确定性 helper；curl for Zotero probes；PDF 质量判定/首页提取；`python3` JSON；`date`。**handoff build/import 自身绝不 spawn 模型、vision、OCR 或网络。**'
          agent = must_replace(agent, old_bash, new_bash, 'agent tools')

          old_heading = '### Step 5 — 对每个被标记方向：方向可信度判定 → 轻量主线标注 → 署名线判定 → 相关论文判定 → OCR → paper-analysis → sidecar 收割 → 登记 →（可选）入库（freshness 判定移至 Step 6 runner job）\n对 flagged 清单里的每个 `(教授名, 方向 D)`：\n\n- 方向 D **不在 flagged 里 → 直接跳过**，不处理。\n- 某方向的 `get_collection_items` 返回空（成员全空）→ 该方向记为「成员为空」跳过并写进 `notes`，不中断后续方向。\n'
          new_heading = '''### Step 5 — 先规划全部高耗 jobs → handoff barrier → 再执行本地/导入路径 → sidecar/登记

**这是两遍流程，不得边判一篇边启动一篇模型。** 先按教授分组：

1. **planning pass**：对该教授所有 flagged directions 只执行下列 1–4（方向可信度、主线、署名、相关集、幂等、成本门）以及 4.5 的确定性 carrier/future-work prepare；期间禁止启动新的 vision OCR、`paper-analysis full`、`gap-only` 或任何逐论文分析叶子。
2. **handoff barrier（每教授一次）**：把该教授 planning pass 后真正缺分析的 jobs 合成一个 bundle。`wait` 在这里软停止；`continue` 才进入本地 execution pass。
3. **execution pass**：`continue` 对仍缺的 jobs 执行旧 OCR→router→`paper-analysis` 语义；成功外部 import 的 jobs 已经是普通本地产物，直接跳过昂贵执行。之后所有路径汇流到 6.5 sidecar-first、facts、runner。

对 planning pass 中每个 `(教授名, 方向 D)`：

- 方向 D **不在 flagged 里 → 直接跳过**，不处理。
- 某方向的 `get_collection_items` 返回空（成员全空）→ 该方向记为「成员为空」跳过并写进 `notes`，不中断后续方向。
'''
          agent = must_replace(agent, old_heading, new_heading, 'agent step5 heading')

          start = agent.index(' 4. **成本门**')
          end = agent.index('\n6.5 **future-work sidecar 收集与补齐（唯一证据链）**', start)
          replacement = r''' 4. **成本门**：若显式 `max_relevant_papers=N`，按 5.2 ①′ 的排序仅保留前 N 篇非点名相关论文，并保留全部 user_note 点名论文；记录 `scope_limited:true` 与被截断标题，不问用户。否则本方向相关集 >10 篇 → `question` 确认「全量跑 N 篇（约 4N 次代理，含 OCR 会更久）/ 只跑前 10」；点名论文仍豁免截断。**成本门完成后 scope 才能进入 handoff fingerprint。**

4.5 **Stage-2 ChatGPT handoff barrier（每教授一次；纯确定性）**：完成该教授所有方向的 1–4 后再执行本节。

   **A. 构造 exact jobs（只含幂等后仍需 full analysis 的论文）**
   - 已有有效 fulltext analysis → 不进 job；旧 `level: abstract` + 当前已有 PDF → 必须进 fulltext upgrade job；stale/missing analysis → 进；scope 截掉的论文不进。
   - handoff carrier 只为 portable 外部执行选**已存在文件**，不触发新 OCR：
     1. 当前有 PDF → bundle 直接带原 PDF，`carrier=pdf, level=fulltext`。即使质量判定显示扫描/坏页也**不要先 OCR**；外部可按 job/future-work prepare 的 OCR 页提示处理。
     2. 无 PDF、但已有可复用 `_ocr/*.txt` → `carrier=ocr, level=fulltext`（只复用既有文件）。
     3. 两者都无 → 仅对这些 keys 调一次 `stage2_input_router.py` 的 normalized abstract exporter 分支，得到 `carrier=abstract_json, level=abstract`；不读取/回显 JSON 正文。
   - `analysis_relpath` 必须是普通 paper-analysis 本来会写入的教授目录相对路径：upgrade job 复用 index 现有 `file` 的相对路径；新 job 按 paper-analysis 当前保存规则 `<论文分析>/<第一作者>/<净化标题>.md` 计算。绝不把 handoff 结果放到第二套专用分析目录。
   - `research_direction` 只含 `{collection_key,name_ja,name_zh,user_note}`；**绝不 profile**。
   - 对有原 PDF 的 fulltext job，允许并推荐先运行现有 `future_work.py prepare <pdf> --debug-dir <tmp>`；这是确定性 helper，不做 OCR/模型。把生成的 `prepare.json` + `candidates.json` 路径写入 job。若 `ocr_required_pages` 非空，只记录并交给外部，**此时绝不本地 vision OCR**。
   - 写 `/tmp/<教授名>_stage2_handoff_jobs.json`：`{"schema":1,"professor":"...","jobs":[...]}`。job 至少含 `item_key/carrier/level/input_path/analysis_relpath/research_direction/research_direction_fp/authorship/authorship_note/relevance_reason`；可带 `ocr_file/future_work_prepare/future_work_candidates`。不得嵌正文、不得放绝对路径到最终 portable manifest（helper 会复制为相对路径）。

   **B. build current bundle（无论 continue/wait 都做）**
   ```bash
   skillrepo exec professor-contact .apm/skills/professor-contact/scripts/stage2_chatgpt_handoff.py build \
     --professor-dir "<教授目录>" --jobs "/tmp/<教授名>_stage2_handoff_jobs.json" --professor "<教授名>"
   ```
   只解析 compact JSON 的 `handoff_id/source_fingerprint/bundle_path/jobs`。bundle 固定落在 `<教授目录>/论文分析/_chatgpt_handoff/`；同输入得到同 logical id，changed PDF/abstract/note/scope/local baseline 得到新 id。**bundle build 不得把 PDF/abstract 正文读入本 agent context。**

   **C. resume import（仅 `chatgpt_result` 提供时）**
   - 必须使用**本轮刚 build 的 current `bundle_path`**去验 result，而不是盲信用户上次给出的旧 bundle；这一步让当前 PDF/abstract/note/scope 的改变先体现在 handoff id/source fingerprint 中。
   ```bash
   skillrepo exec professor-contact .apm/skills/professor-contact/scripts/stage2_chatgpt_handoff.py import \
     --professor-dir "<教授目录>" --bundle "<current bundle_path>" \
     --result "<chatgpt_result>" --future-work-script "<paper-analysis future_work.py absolute path>"
   ```
   - importer 必须先验 ZIP safety、schema/kind、handoff/source/job/item/input hash，再验 analysis 模板；future-work 只接受 selection/OCR，仍由本地 `future_work.py merge-ocr/validate/finalize` 产生 authoritative sidecar。
   - importer 记录 bundle 生成时的 local analysis/index baseline：旧 abstract/stale artifact **只要自 bundle 后没变**可以被 matching fulltext result 升级；bundle 后本地 analysis/index 有任何变化则 `handoff_stale`，绝不覆盖更新工作。
   - `status=imported`：这些 exact jobs 已变成普通 analysis/sidecar/index 项，execution pass 直接跳过。
   - `partial|needs_external_result` 且 `chatgpt_handoff=wait`：保留已安全导入 jobs，返回 `result=needs_external_result` + missing/invalid jobs；**禁止调用本地 OCR/paper-analysis 补洞**。下一次重跑会按当前幂等状态为剩余 jobs 生成新的 bundle。
   - `partial` 且调用方显式用了 `chatgpt_handoff=continue`：`continue` 本身就是允许本地执行的显式选择，仅对仍缺 jobs 进入 execution pass。

   **D. wait soft stop**
   - `chatgpt_handoff` 缺失 → 向后兼容固定当 `continue`；本 agent 不在这里问用户。
   - `chatgpt_handoff=wait`、没有 `chatgpt_result`、且 bundle `jobs>0` → **立即返回** `result=needs_external_result, reason_code=chatgpt_result_required, handoff_id, bundle_path, jobs`。这是软停止，不是 error；从这里之后不得触发 Step 5.5/5.6 的新 OCR/模型。
   - bundle `jobs=0` → 无高耗工作可等待；即使 mode=wait 也继续 6.5/Step 6。
   - `chatgpt_handoff=continue` → bundle 生成后直接进入下面旧本地 execution semantics；ZIP 的存在不能改变普通 Stage 2 facts/state。

5. **本地 OCR execution pass（只在 continue 且仍缺 job 时）**：
   - **判定**沿用原规则：PyMuPDF/质量分数判断扫描版；这是本地执行路径的一部分，handoff barrier 之前只允许质量判定，不允许新 vision OCR。
   - **复用** `<论文分析>/_ocr/<标题>.txt`；已有即直接用。
   - **执行**仍按原 llm-ocr-refresh + vision-tools 机制逐页渲染/`glance --ocr`，写同一 `_ocr/<标题>.txt` 元数据头与逐页文本；失败页记录；整篇 OCR 全失败则后续 router 走 normalized abstract JSON。
   - `wait` 路径永远不能到这里，除非 caller 后来明确改为 `continue`。

6. **本地 route → `paper-analysis full`（只处理 execution pass 剩余 jobs，批量并发 ≤3）**：
   - 仍按现有 `stage2_input_router.py`：`OCR absolute path → usable PDF absolute path → normalized abstract JSON absolute path`。一次写 route JSON，只含 `item_key/ocr_path/pdf_path`；stdout 只解析 compact routes，不读 normalized abstract body。
   - `status=error` 仍明确 partial/error，不回退 raw Zotero key、不伪造分析。
   - `status=ok` 的 prompt 仍只传 `routes[].paper` + `/tmp/<教授名>_<collection_key>_研究方向.md` + `save:<教授目录>`；绝不嵌正文。
   - **continue 的语义要求**：除 handoff ZIP 这个低成本 side effect 外，本段对所有未被成功 external import 的 jobs 与旧实现完全相同；不因为 ZIP 存在而改变 OCR、重试、level、sidecar 或 runner 语义。
   - 每篇成功后 `_index.json level` 仍取实际 local route（`ocr|pdf → fulltext`, `abstract_json → abstract`）；external import 的 index entry 由 Stage-2 handoff helper 在同一唯一-writer边界下写入并带可选 `analysis_executor=chatgpt_handoff/handoff_id` provenance，provenance 不参与 gap/Stage3 语义。
'''
          agent = agent[:start] + replacement + agent[end:]

          old_result_enum = '  "result": "ok|partial|needs_input|error",\n  "program_root": "<abs>",'
          new_result_enum = '  "result": "ok|partial|needs_input|needs_external_result|error",\n  "program_root": "<abs>",\n  "reason_code": "<chatgpt_result_required|...|null>",\n  "handoffs": [{"professor":"", "handoff_id":"", "bundle_path":"", "jobs":0, "missing":[]}],'
          agent = must_replace(agent, old_result_enum, new_result_enum, 'agent return enum')

          old_status = '- `ok` — 全部被标记方向完成；`partial` — 有方向跳过/个别论文分析失败/「疑似幻觉·勉强」方向/runner 返回 needs_decision 且用户未决/部分 freshness 降级 unknown；`error` — Zotero 离线且用户中止 / 程序根无法确定 / runner 校验失败且无旧产物可保留。`notes` 里写 reason_code（`result_missing` / `invalid_result_json` / `unknown_reference_id` / `manual_markdown_changed` 等）与方向级说明。'
          new_status = '- `ok` — 全部被标记方向完成；`needs_external_result` — `wait` 已生成 bundle 或外部结果仍缺/非法，是可恢复软停止，必须返回 `chatgpt_result_required` 或 importer reason_code + handoff/missing；`partial` — 其它方向级失败/降级；`error` — Zotero/路径/runner 等不可继续错误。**wait 的 external 不完整绝不能降级为本地高耗执行。**'
          agent = must_replace(agent, old_status, new_status, 'agent return semantics')

          hard_marker = '## Hard rules\n- **只 spawn 两类 subagent**：'
          hard_insert = '''## Hard rules
- **handoff barrier 不可绕过**：post-cost-gate/post-idempotency jobs 必须先 build ZIP；`wait` 在任何新 vision OCR/`paper-analysis full|gap-only` 前停止。resume 必须先按当前输入 rebuild current bundle，再 import external result；不匹配即 stale/mismatch，绝不“尽量用”。
- **handoff 不是事实源**：外部只能执行 manifest 给定 job；不能提供权威 `_index.json`、`.future_work.json`、`套磁候选输入.json`、gap_id/direction ID。import 后仍只走普通 sidecar/facts/contact_state 路径，Stage 3 仍只读 `套磁候选输入.json`。
- **只 spawn 两类 subagent**：'''
          agent = must_replace(agent, hard_marker, hard_insert, 'agent hard rules')

          agent_path.write_text(agent, encoding='utf-8')
          PY
