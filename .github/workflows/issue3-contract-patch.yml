name: Issue 3 contract patch

on:
  push:
    branches: [issue-3-chatgpt-stage2-handoff]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: issue-3-chatgpt-stage2-handoff
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch caller and analyzer contracts
        run: python .github/scripts/issue3_contract_patch.py
      - name: Commit contract changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No contract changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .apm/skills/professor-contact/SKILL.md .apm/agents/professor-contact-analyzer.agent.md
          git commit -m "feat: wire Stage 2 handoff into workflow"
          git push origin HEAD:issue-3-chatgpt-stage2-handoff
